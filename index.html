<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planning TDS — génération et équité</title>
  <script>try { var t = localStorage.getItem('tds-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
  <link rel="stylesheet" href="style.css?v=22">
</head>
<body>
  <header>
    <h1>Planning TDS</h1>
    <nav id="tabs">
      <button data-tab="planning" class="active">Planning</button>
      <button data-tab="stats">Statistiques</button>
      <button data-tab="requests">Demandes</button>
      <button data-tab="params">Paramètres</button>
      <button data-tab="data">Données</button>
    </nav>
    <button id="undo-btn" class="themebtn undobtn" type="button" data-act="undo" hidden></button>
    <button id="theme-btn" class="themebtn" type="button" title="Basculer entre mode clair et mode sombre"></button>
  </header>
  <main>
    <div id="toast" hidden></div>
    <div id="notice" hidden></div>
    <section id="tab-planning"></section>
    <section id="tab-stats" hidden></section>
    <section id="tab-requests" hidden></section>
    <section id="tab-params" hidden></section>
    <section id="tab-data" hidden></section>
  </main>
  <footer>Les données restent dans votre navigateur (aucun envoi sur un serveur). Un bandeau vous rappelle d'exporter une sauvegarde JSON quand c'est utile.</footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="planner.js?v=22"></script>
  <script src="app.js?v=22"></script>
</body>
</html>
